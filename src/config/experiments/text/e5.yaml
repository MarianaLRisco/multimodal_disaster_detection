experiment_name: e5

dataset_name: CrisisMMD

dataset: src/config/datasets/crisismmd.yaml

model_config: src/config/models/text/bge_m3.yaml

unfreeze_last_n_layers: 2

training:

  batch_size: 16

  epochs: 10

  learning_rate: 0.0001

  num_workers: 2

  weight_decay: 0.00001

  shuffle: true

optimizer:

  name: adamw

device: cuda

modalities:

  text: true

  image: false

output_dir: results/${dataset_name}/text