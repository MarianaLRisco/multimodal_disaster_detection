experiment_name: Qwen3

dataset_name: CrisisMMD

dataset: src/config/datasets/crisismmd.yaml

model_config: src/config/models/text/qwen2.yaml

unfreeze_last_n_layers: 0

training:

  batch_size: 32

  epochs: 10

  learning_rate: 1.0e-5

  num_workers: 2

  weight_decay: 1.0e-4

  shuffle: true

optimizer:

  name: adamw

device: cuda

modalities:

  text: true

  image: false

output_dir: results/${dataset_name}/text