experiment_name: jinav5

dataset_name: CrisisMMD

dataset: src/config/datasets/crisismmd.yaml

model_config: src/config/models/text/jinav5.yaml

unfreeze_last_n_layers: 0

training:

  batch_size: 64

  epochs: 15

  learning_rate: 0.0005

  num_workers: 2

  weight_decay: 0.0001

  shuffle: true

optimizer:

  name: sgd

device: cuda

modalities:

  text: true

  image: false

scheduler:

  name: cosine_warmup
  
  warmup_ratio: 0.2

multigpu: true

output_dir: results/${dataset_name}/text