experiment_name: bge_m3

dataset_name: CrisisMMD

dataset: src/config/datasets/crisismmd.yaml

model_config: src/config/models/text/bge_m3.yaml

unfreeze_last_n_layers: 0

training:

  batch_size: 64

  epochs: 15

  learning_rate:  1.0e-5

  num_workers: 2

  weight_decay:  1.0e-4

  shuffle: true

optimizer:

  name: adamw

device: cuda

modalities:

  text: true

  image: false

scheduler:

  name: cosine_warmup
  
  warmup_ratio: 0.2

multigpu: true


output_dir: results/${dataset_name}/text