experiment_name: convnext_base

dataset_name: DamageDataset

dataset: src/config/datasets/damage.yaml

model_config: src/config/models/vision/convnext_base.yaml

unfreeze_last_n_layers: 0

training:

  batch_size: 64

  epochs: 15

  learning_rate: 7.0e-04

  num_workers: 2

  weight_decay: 1.0e-02

  shuffle: true

optimizer:

  name: adamw

device: cuda

modalities:

  text: false

  image: true

output_dir: results/${dataset_name}/vision

scheduler:

  name: cosine_warmup
  
  warmup_ratio: 0.2

multigpu: true