experiment_name: E5_ConvNext

dataset_name: CrisisMMD

dataset: src/config/datasets/crisismmd.yaml

text_model_config: src/config/models/text/e5.yaml

image_model_config: src/config/models/vision/convnext_base.yaml

model_config: src/config/models/multimodal/crossmodal.yaml

unfreeze_last_n_layers: 2

training:

  batch_size: 16

  epochs: 15

  learning_rate: 1.0e-4

  num_workers: 2

  weight_decay: 1.0e-5

  shuffle: true

optimizer:

  name: adamw

device: cuda

modalities:

  text: true

  image: true

output_dir: results/${dataset_name}/multimodal