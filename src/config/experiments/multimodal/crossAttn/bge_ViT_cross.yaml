experiment_name: bge_ViT_crossmodal

dataset_name: DamageDataset

dataset: src/config/datasets/damage.yaml

text_model_config: src/config/models/text/bge_m3.yaml

image_model_config: src/config/models/vision/vit_L_14.yaml

model_config: src/config/models/multimodal/crossmm.yaml

unfreeze_last_n_layers: 0

load_best_model: false

use_lora: false

training:

  batch_size: 64 #16

  epochs: 20

  learning_rate: 7.0e-5

  num_workers: 2

  weight_decay: 1.0e-3

  shuffle: true

scheduler:

  name: cosine_warmup
  
  warmup_ratio: 0.05


lora:

  text: true

  vision: true

  r: 8

  alpha: 16

  dropout: 0.1

  target_modules: ["attn.out_proj","mlp.c_fc","mlp.c_proj"]

optimizer:

  name: adamw

device: cuda

multi_gpu: true

modalities:

  text: true

  image: true

output_dir: results/${dataset_name}/multimodal