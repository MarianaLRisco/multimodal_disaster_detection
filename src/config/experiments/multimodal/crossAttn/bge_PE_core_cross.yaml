experiment_name: bge_PE_Core_crossmodal

dataset_name:  CrisisMMD

dataset: src/config/datasets/crisismmd.yaml

text_model_config: src/config/models/text/bge_m3.yaml

image_model_config: src/config/models/vision/PE_Core_L_14_336.yaml

model_config: src/config/models/multimodal/crossmm.yaml

unfreeze_last_n_layers: 0

load_best_model: false

use_lora: false

training:

  batch_size: 64 #16

  epochs: 20

  learning_rate: 2.0e-5 #2.0e-5

  num_workers: 2

  weight_decay: 1.0e-2

  shuffle: true

scheduler:

  name: cosine_warmup
  
  warmup_ratio: 0.2

lora:

  text: true

  vision: true

  r: 8

  alpha: 16

  dropout: 0.1

  target_modules: ["attn.qkv","attn.proj"]

optimizer:

  name: adamw

device: cuda

multi_gpu: true

modalities:

  text: true

  image: true

output_dir: results/${dataset_name}/multimodal