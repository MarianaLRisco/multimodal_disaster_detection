experiment_name: vit_L_14
dataset_name: CrisisMMD
dataset: src/config/datasets/crisismmd.yaml
model_config: src/config/models/vision/vit_L_14.yaml
unfreeze_last_n_layers: 3
training:
  batch_size: 16
  epochs: 10
  learning_rate: 1.0e-07
  num_workers: 2
  weight_decay: 0.005
  shuffle: true
optimizer:
  name: adamw
device: cuda
modalities:
  text: false
  image: true
output_dir: results/${dataset_name}/vision
