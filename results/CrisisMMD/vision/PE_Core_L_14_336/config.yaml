experiment_name: PE_Core_L_14_336
dataset_name: CrisisMMD
dataset: src/config/datasets/crisismmd.yaml
model_config: src/config/models/vision/PE_Core_L_14_336.yaml
unfreeze_last_n_layers: 0
training:
  batch_size: 64
  epochs: 15
  learning_rate: 0.0001
  num_workers: 2
  weight_decay: 0.001
  shuffle: true
optimizer:
  name: adamw
device: cuda
modalities:
  text: false
  image: true
scheduler:
  name: cosine_warmup
  warmup_ratio: 0.2
multigpu: true
output_dir: results/${dataset_name}/vision
