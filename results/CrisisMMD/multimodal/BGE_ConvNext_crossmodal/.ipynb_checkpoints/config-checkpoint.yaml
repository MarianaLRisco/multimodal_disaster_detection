experiment_name: BGE_ConvNext_crossmodal
dataset_name: CrisisMMD
dataset: src/config/datasets/crisismmd.yaml
text_model_config: src/config/models/text/bge_m3.yaml
image_model_config: src/config/models/vision/convnext_base.yaml
model_config: src/config/models/multimodal/crossmm.yaml
unfreeze_last_n_layers: 0
use_lora: false
load_best_model: false
training:
  batch_size: 8
  epochs: 10
  learning_rate: 7.0e-06
  num_workers: 2
  weight_decay: 0.0001
  shuffle: true
lora:
  text: true
  vision: true
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules:
  - mlp.fc1
  - mlp.fc2
optimizer:
  name: adamw
device: cuda
modalities:
  text: true
  image: true
output_dir: results/${dataset_name}/multimodal
