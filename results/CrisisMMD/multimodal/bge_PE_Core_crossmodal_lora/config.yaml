experiment_name: bge_PE_Core_crossmodal_lora
dataset_name: CrisisMMD
dataset: src/config/datasets/crisismmd.yaml
text_model_config: src/config/models/text/bge_m3.yaml
image_model_config: src/config/models/vision/PE_Core_L_14_336.yaml
model_config: src/config/models/multimodal/crossmm.yaml
unfreeze_last_n_layers: 3
use_lora: true
load_best_model: true
loss: ce
training:
  batch_size: 32
  epochs: 5
  learning_rate: 5.0e-06
  num_workers: 2
  weight_decay: 0.01
  shuffle: true
scheduler:
  name: cosine_warmup
  warmup_ratio: 0.1
lora:
  text: true
  vision: true
  r: 8
  alpha: 16
  dropout: 0.1
  last_n_text_layers: 8
  last_n_vision_layers: 6
  target_modules:
  - attn.qkv
  - attn.proj
optimizer:
  name: adamw
device: cuda
multi_gpu: true
modalities:
  text: true
  image: true
output_dir: results/${dataset_name}/multimodal
