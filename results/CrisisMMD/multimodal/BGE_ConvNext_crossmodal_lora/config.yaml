experiment_name: BGE_ConvNext_crossmodal_lora
dataset_name: CrisisMMD
dataset: src/config/datasets/crisismmd.yaml
text_model_config: src/config/models/text/bge_m3.yaml
image_model_config: src/config/models/vision/convnext_base.yaml
model_config: src/config/models/multimodal/crossmm.yaml
unfreeze_last_n_layers: 3
use_lora: true
load_best_model: true
loss: ce
training:
  batch_size: 64
  epochs: 20
  learning_rate: 4.0e-06
  num_workers: 2
  weight_decay: 0.01
  shuffle: true
scheduler:
  name: cosine_warmup
  warmup_ratio: 0.05
lora:
  text: true
  vision: true
  r: 32
  alpha: 16
  dropout: 0.1
  last_n_text_layers: 4
  last_n_vision_layers: 4
  target_modules:
  - mlp.fc1
  - mlp.fc2
optimizer:
  name: adamw
device: cuda
multi_gpu: true
modalities:
  text: true
  image: true
output_dir: results/${dataset_name}/multimodal
