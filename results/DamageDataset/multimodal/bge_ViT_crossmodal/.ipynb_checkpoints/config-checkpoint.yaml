experiment_name: bge_ViT_crossmodal
dataset_name: DamageDataset
dataset: src/config/datasets/damage.yaml
text_model_config: src/config/models/text/bge_m3.yaml
image_model_config: src/config/models/vision/vit_L_14.yaml
model_config: src/config/models/multimodal/crossmodal.yaml
unfreeze_last_n_layers: 0
training:
  batch_size: 32
  epochs: 10
  learning_rate: 1.0e-05
  num_workers: 2
  weight_decay: 0.005
  shuffle: true
optimizer:
  name: adamw
device: cuda
modalities:
  text: true
  image: true
output_dir: results/${dataset_name}/multimodal
