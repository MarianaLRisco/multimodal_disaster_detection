experiment_name: BGE_ConvNext_crossmodal_lora
dataset_name: DisasterNet
dataset: src/config/datasets/disasternet.yaml
text_model_config: src/config/models/text/bge_m3.yaml
image_model_config: src/config/models/vision/convnext_base.yaml
model_config: src/config/models/multimodal/crossmm.yaml
unfreeze_last_n_layers: 5
use_lora: true
training:
  batch_size: 32
  epochs: 10
  learning_rate: 1.0e-05
  num_workers: 2
  weight_decay: 0.01
  shuffle: true
lora:
  text: true
  vision: true
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules:
  - mlp.fc1
  - mlp.fc2
optimizer:
  name: adamw
device: cuda
modalities:
  text: true
  image: true
output_dir: results/${dataset_name}/multimodal
