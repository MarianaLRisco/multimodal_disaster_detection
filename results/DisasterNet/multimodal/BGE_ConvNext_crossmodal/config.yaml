experiment_name: BGE_ConvNext_crossmodal
dataset_name: DisasterNet
dataset: src/config/datasets/disasternet.yaml
text_model_config: src/config/models/text/bge_m3.yaml
image_model_config: src/config/models/vision/convnext_base.yaml
model_config: src/config/models/multimodal/crossmodal.yaml
unfreeze_last_n_layers: 0
training:
  batch_size: 32
  epochs: 15
  learning_rate: 2.0e-06
  num_workers: 2
  weight_decay: 0.005
  shuffle: true
optimizer:
  name: adamw
device: cuda
modalities:
  text: true
  image: true
output_dir: results/${dataset_name}/multimodal
